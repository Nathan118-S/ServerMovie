# Sandy Server — bay microswitch ESP32 (ESPHome)
#
# One ESP32 reads a microswitch per bay and exposes each as a binary_sensor
# to Home Assistant over ESPHome's native API — no MQTT broker needed.
#
# WIRING (per bay):
#   GPIO pin ---- microswitch ---- GND
#   Using INPUT_PULLUP means the pin reads HIGH when the switch is open
#   and LOW when closed. Wire the switch so it's held CLOSED (pressed) by
#   the weight/presence of the case sitting in the bay, and springs OPEN
#   when the case is lifted out — that's what `inverted: true` below
#   assumes ("on" state = case present). If your switches are wired the
#   opposite way, just remove `inverted: true` on that sensor.
#
# GPIO NOTES for ESP32 (adjust pin numbers to match your actual wiring):
#   - Good general-purpose input pins: 4, 5, 13, 14, 15, 16, 17, 18, 19,
#     21, 22, 23, 25, 26, 27, 32, 33, plus 34/35/36/39 (input-only, no
#     internal pullup — need an external pull-up resistor if you use these).
#   - Avoid: 0, 2, 12, 15 have boot-strapping roles (usually fine once
#     booted, but can cause boot issues if held low/high at power-on —
#     safest to avoid for switches if you have spare pins).
#   - Avoid entirely: 6-11 (connected to the ESP32's internal flash).
#   - A single ESP32 comfortably handles 20-28 bays this way. Beyond
#     that, add a second ESP32 running a second copy of this file with
#     a different `name:`/`friendly_name:` and continue the bay numbers.
#
# Duplicate the `binary_sensor:` block below once per bay, changing the
# `pin:`, `name:`, and `id:` each time. Only 4 example bays are included —
# copy the pattern for as many as you actually have.

esphome:
  name: sandy-server-bays
  friendly_name: Sandy Server Bays

esp32:
  board: esp32dev
  framework:
    type: arduino

# Fill these in, or better, use ESPHome's secrets.yaml so credentials
# aren't sitting in a file you might share/commit:
#   wifi_ssid: !secret wifi_ssid
#   wifi_password: !secret wifi_password
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Lets Home Assistant discover and control this device automatically.
api:
  encryption:
    key: !secret api_encryption_key

ota:
  password: !secret ota_password

logger:

binary_sensor:
  - platform: gpio
    id: bay_01
    name: "Bay 01"
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
    inverted: true
    filters:
      - delayed_on: 50ms   # basic debounce
      - delayed_off: 50ms

  - platform: gpio
    id: bay_02
    name: "Bay 02"
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
    inverted: true
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms

  - platform: gpio
    id: bay_03
    name: "Bay 03"
    pin:
      number: GPIO13
      mode: INPUT_PULLUP
    inverted: true
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms

  - platform: gpio
    id: bay_04
    name: "Bay 04"
    pin:
      number: GPIO14
      mode: INPUT_PULLUP
    inverted: true
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms

  # ... duplicate the block above for every remaining bay, incrementing
  # bay_05, bay_06, etc. and picking the next free GPIO from the list
  # in the comment at the top of this file.

  # The cabinet/case door — separate from the bay switches above. Wired
  # so "on" = door open, "off" = door closed; if your switch reads the
  # opposite way, add `inverted: true` here like the bay sensors have.
  - platform: gpio
    id: cabinet_door
    name: "Cabinet Door"
    pin:
      number: GPIO27
      mode: INPUT_PULLUP
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
